    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "PROPRE 360",
        "description": "Société de nettoyage professionnel à Marrakech : maisons, riads, bureaux et commerces.",

        },

          "https://www.facebook.com/Propre360/",
          "https://www.linkedin.com/company/propre360/"
        ]
      }
    </script>
  
    <!-- Applique le thème avant le premier rendu : évite le flash blanc. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('propre360-theme')
          var light =
            v === 'light' ||
            (!v && window.matchMedia('(prefers-color-scheme: light)').matches)
          if (light) {
            document.documentElement.classList.add('light')
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
